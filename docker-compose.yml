version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: margdarshan_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: margdarshan
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: margdarshan_redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: margdarshan_backend
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/margdarshan
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: margdarshan_gravityx_super_secret_jwt_key_2026
      AI_PROVIDER: mock
      DEMO_MODE: "true"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./uploads:/app/uploads

  frontend:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: margdarshan_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
